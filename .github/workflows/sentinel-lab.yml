name: sentinel-lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topicos/03-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pyyaml==6.0.*"
      - run: python tools/lab.py all
